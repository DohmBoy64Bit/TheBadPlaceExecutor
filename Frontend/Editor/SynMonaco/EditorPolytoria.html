<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta http-equiv='X-UA-Compatible' content='IE=edge'>
  <title>Diddy X Editor</title>
  <style type="text/css" media="screen">
    body {
        overflow: hidden;
        margin: 0;
        padding: 0;
    }

    #editor {
        margin: 0;
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
    }
  </style>
  <script src="ace/ace.js" type="text/javascript" charset="utf-8"></script>
  <script src="ace/ext-language_tools.js"></script>
</head>
  <body style="background-color: #1E1E1E">
    <pre id="editor">-- Diddy X Polytoria Executor
-- Made by blub

</pre>
    <script>
        var GetText;
        var SetText;
        var ClearText;
        var SetTheme;
        var LoadCompletions;
        var LoadHighlighting;

        ace.require("ace/ext/language_tools");
        var editor = ace.edit("editor");
        editor.setTheme("ace/theme/tomorrow_night_eighties");
        editor.session.setMode("ace/mode/lua");
        editor.setOption("enableBasicAutocompletion", true);
        editor.setOption("enableLiveAutocompletion", true);
        editor.setOption("enableSnippets", true);
        editor.setOption("cursorStyle", "smooth");
        editor.setShowPrintMargin(false);
        editor.setFontSize(13);
        editor.setBehavioursEnabled(true);
        editor.setWrapBehavioursEnabled(true);

        // Polytoria-specific completions (will be injected from C#)
        var polytoriaCompletions = {};
        var classMembers = {};

        // Custom completer for Polytoria API
        var polytoriaCompleter = {
            getCompletions: function(editor, session, pos, prefix, callback) {
                var completions = [];
                var line = session.getLine(pos.row).substring(0, pos.column);
                
                // Check for member access (game. or instance:)
                var memberMatch = line.match(/(\w+)[\.:]\s*\w*$/);
                if (memberMatch) {
                    var objectName = memberMatch[1];
                    var className = objectName;
                    
                    // Map common globals to their types
                    var globalTypes = {
                        'game': 'Environment',
                        'workspace': 'Environment',
                        'script': 'BaseScript'
                    };
                    
                    if (globalTypes[objectName]) {
                        className = globalTypes[objectName];
                    }
                    
                    // Get members for this class
                    if (classMembers[className]) {
                        completions = classMembers[className].map(function(member) {
                            return {
                                caption: member.caption,
                                value: member.value || member.caption,
                                snippet: member.snippet || member.value || member.caption,
                                meta: member.meta,
                                type: member.type,
                                docHTML: member.docHTML,
                                score: 1000
                            };
                        });
                    }
                } else {
                    // Global scope - show all globals, keywords, and functions
                    for (var key in polytoriaCompletions) {
                        var comp = polytoriaCompletions[key];
                        completions.push({
                            caption: comp.caption,
                            value: comp.caption,
                            snippet: comp.snippet || comp.caption,
                            meta: comp.meta,
                            docHTML: comp.docHTML,
                            score: 900
                        });
                    }
                }
                
                callback(null, completions);
            }
        };

        editor.completers = [polytoriaCompleter];

        // Smart auto-closing for common Lua patterns
        editor.commands.addCommand({
            name: "autoCloseLuaBlocks",
            bindKey: {win: "Return", mac: "Return"},
            exec: function(editor) {
                var pos = editor.getCursorPosition();
                var line = editor.session.getLine(pos.row);
                var trimmed = line.trim();
                
                // Auto-close function blocks
                if (trimmed.match(/function\s*\([^\)]*\)\s*$/)) {
                    editor.insert("\n    \n");
                    var newPos = editor.getCursorPosition();
                    editor.session.insert({row: newPos.row + 1, column: 0}, "end");
                    editor.moveCursorTo(newPos.row, newPos.column + 4);
                    return;
                }
                
                // Auto-close :Connect(function() blocks
                if (trimmed.match(/:Connect\s*\(\s*function\s*\([^\)]*\)\s*$/)) {
                    editor.insert("\n    \n");
                    var newPos = editor.getCursorPosition();
                    editor.session.insert({row: newPos.row + 1, column: 0}, "end)");
                    editor.moveCursorTo(newPos.row, newPos.column + 4);
                    return;
                }
                
                // Auto-close if/then blocks
                if (trimmed.match(/if\s+.+\s+then\s*$/)) {
                    editor.insert("\n    \n");
                    var newPos = editor.getCursorPosition();
                    editor.session.insert({row: newPos.row + 1, column: 0}, "end");
                    editor.moveCursorTo(newPos.row, newPos.column + 4);
                    return;
                }
                
                // Auto-close for/do blocks
                if (trimmed.match(/for\s+.+\s+do\s*$/)) {
                    editor.insert("\n    \n");
                    var newPos = editor.getCursorPosition();
                    editor.session.insert({row: newPos.row + 1, column: 0}, "end");
                    editor.moveCursorTo(newPos.row, newPos.column + 4);
                    return;
                }
                
                // Auto-close while/do blocks
                if (trimmed.match(/while\s+.+\s+do\s*$/)) {
                    editor.insert("\n    \n");
                    var newPos = editor.getCursorPosition();
                    editor.session.insert({row: newPos.row + 1, column: 0}, "end");
                    editor.moveCursorTo(newPos.row, newPos.column + 4);
                    return;
                }
                
                // Default behavior
                editor.insert("\n");
            }
        });

        // Functions callable from C#
        GetText = function() {
            return editor.getValue();
        }

        SetText = function(x) {
          editor.setValue(x);
          editor.session.setValue(x);
          editor.clearSelection();
        }

        ClearText = function() {
          editor.setValue("");
          editor.clearSelection();
        }

        SetTheme = function(th) {
          editor.setTheme("ace/theme/" + th);
        }

        LoadCompletions = function(completionsJs) {
            try {
                // Execute the JavaScript to load completions
                eval(completionsJs);
                console.log("Polytoria completions loaded!");
            } catch(e) {
                console.error("Failed to load completions: " + e);
            }
        }

        LoadHighlighting = function(highlightConfigJs) {
            try {
                var config = JSON.parse(highlightConfigJs);
                var LuaHighlightRules = ace.require("ace/mode/lua_highlight_rules").LuaHighlightRules;
                
                // Inject new keywords into the mapper
                var oldGetKeywordMapper = LuaHighlightRules.prototype.getKeywordMapper;
                LuaHighlightRules.prototype.createKeywordMapper = function(map, defaultToken, ignoreCase, splitChar) {
                    if (config.keywords) map["keyword"] += "|" + config.keywords;
                    if (config.functions) map["support.function"] += "|" + config.functions;
                    if (config.constants) map["constant.language"] += "|" + config.constants;
                    
                    return oldGetKeywordMapper.call(this, map, defaultToken, ignoreCase, splitChar);
                };
                
                // Re-instantiate the highlight rules for the current session
                editor.session.setMode("ace/mode/lua");
                console.log("Polytoria highlighting loaded!");
            } catch(e) {
                console.error("Failed to load highlighting: " + e);
            }
        }

        // Disable right-click context menu
        document.oncontextmenu = function() {
          return false;
        }
    </script>
  </body>
</html>
